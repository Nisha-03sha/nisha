<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="450" y="45" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Restaurant Order Management System - Architecture
  </text>
  <text x="450" y="70" font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Full-Stack Integration: Vanilla Frontend with Native C Backend Data Structures
  </text>

  <!-- Box 1: Frontend Client -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="220" height="310" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="50" y="110" width="220" height="40" rx="12" fill="#0284c7"/>
    <text x="160" y="136" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      🌐 Web Frontend
    </text>

    <text x="75" y="180" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">• HTML5 &amp; CSS3</text>
    <text x="85" y="200" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Responsive UI &amp; Cards</text>

    <text x="75" y="235" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">• Vanilla JavaScript</text>
    <text x="85" y="255" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Fetch API (REST calls)</text>

    <text x="75" y="290" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">• UI Modules</text>
    <text x="85" y="310" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">1. Order Menu &amp; Cart</text>
    <text x="85" y="328" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">2. Live Queue Dashboard</text>
    <text x="85" y="346" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">3. Kitchen Admin Board</text>
    <text x="85" y="364" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">4. DS Visualizer Canvas</text>
    <text x="85" y="382" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">5. Bill Receipt Generator</text>
  </g>

  <!-- Communication Arrows -->
  <g>
    <!-- Top Arrow: HTTP Requests -->
    <path d="M 285 220 L 375 220" stroke="#f97316" stroke-width="3" fill="none" marker-end="url(#arrow1)"/>
    <polygon points="375,215 385,220 375,225" fill="#f97316"/>
    <text x="330" y="210" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#f97316" text-anchor="middle">
      HTTP POST / GET / PUT
    </text>
    <text x="330" y="235" font-family="Courier New, monospace" font-size="9" fill="#fed7aa" text-anchor="middle">
      JSON Payloads
    </text>

    <!-- Bottom Arrow: HTTP Responses -->
    <path d="M 385 300 L 295 300" stroke="#10b981" stroke-width="3" fill="none"/>
    <polygon points="295,295 285,300 295,305" fill="#10b981"/>
    <text x="335" y="290" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">
      JSON Responses
    </text>
    <text x="335" y="315" font-family="Courier New, monospace" font-size="9" fill="#a7f3d0" text-anchor="middle">
      Queue State &amp; Pointers
    </text>
  </g>

  <!-- Box 2: Native C Backend -->
  <g filter="url(#shadow)">
    <rect x="400" y="110" width="450" height="310" rx="12" fill="url(#cardGrad)" stroke="#f97316" stroke-width="2"/>
    <rect x="400" y="110" width="450" height="40" rx="12" fill="url(#primaryGrad)"/>
    <text x="625" y="136" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ⚙️ Native C Backend (server.c, queue.c, linkedlist.c)
    </text>

    <!-- Sub-block 1: Queue -->
    <rect x="420" y="165" width="410" height="105" rx="8" fill="#111827" stroke="#6366f1" stroke-width="1.5"/>
    <text x="435" y="190" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#a5b4fc">
      1. FIFO Order Queue (OrderQueue)
    </text>
    <text x="435" y="210" font-family="Courier New, monospace" font-size="11" fill="#e2e8f0">
      FRONT Pointer &rarr; [Order #101] &rarr; [Order #102] &rarr; REAR Pointer
    </text>
    <text x="435" y="230" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">
      • enqueue(q, order): Adds new order at REAR (O(1))
    </text>
    <text x="435" y="248" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">
      • dequeue(q): Removes completed order from FRONT (O(1))
    </text>

    <!-- Sub-block 2: Linked List -->
    <rect x="420" y="285" width="410" height="115" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="435" y="310" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#34d399">
      2. Food Items Singly Linked List (Item*)
    </text>
    <text x="435" y="330" font-family="Courier New, monospace" font-size="11" fill="#e2e8f0">
      order->items &rarr; [Biriyani|next] &rarr; [Coke|next] &rarr; NULL
    </text>
    <text x="435" y="352" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">
      • addItem(order, ...): Dynamically allocates node with malloc()
    </text>
    <text x="435" y="370" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">
      • calculateTotal(order): Linear traversal computing total bill
    </text>
    <text x="435" y="388" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">
      • freeItemList(): Deallocates heap memory preventing memory leaks
    </text>
  </g>
</svg>
